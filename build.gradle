import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.quiltmc.org/repository/release/" }
}

configurations {
    // Library jars we want shaded into the mod jar (not Fabric mods).
    shadowBundle
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ModMenu surfaces our custom config screen from the in-game mods list.
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // PostHog telemetry SDK — compiled against, and bundled (relocated) into the jar.
    implementation "com.posthog:posthog-server:${project.posthog_version}"
    shadowBundle "com.posthog:posthog-server:${project.posthog_version}"

    // Tests.
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    runs {
        client {
            programArgs '--username', 'Zeffut'
            // Forward -Pautoupdate.* project properties to the client JVM as -D system properties,
            // so the embedded AutoUpdate module can be exercised in dev (custom mods dir, etc.).
            ['autoupdate.enabled', 'autoupdate.mods.dir', 'autoupdate.api'].each { key ->
                if (project.hasProperty(key)) {
                    vmArg "-D${key}=${project.property(key)}"
                }
            }
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Relocate every bundled package under our namespace so two mods can't clash on
    // shared libs (gson/okhttp/etc.). Verify the real transitive packages with
    // `./gradlew dependencies --configuration shadowBundle` and add any that are missing.
    relocate 'com.posthog', 'fr.zeffut.mcwrapped.shadow.posthog'
    relocate 'okhttp3', 'fr.zeffut.mcwrapped.shadow.okhttp3'
    relocate 'okio', 'fr.zeffut.mcwrapped.shadow.okio'
    relocate 'com.google.gson', 'fr.zeffut.mcwrapped.shadow.gson'
    relocate 'kotlin', 'fr.zeffut.mcwrapped.shadow.kotlin'
    relocate 'org.jetbrains', 'fr.zeffut.mcwrapped.shadow.jetbrains'
    // org.jetbrains:annotations also ships an org.intellij.lang.annotations package — relocate it
    // too so nothing leaks into the root namespace and clashes with other mods.
    relocate 'org.intellij', 'fr.zeffut.mcwrapped.shadow.intellij'
}

tasks.named('remapJar') {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
